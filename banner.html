<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Банер CARFORSALE — генератор кодом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,900&family=Roboto+Condensed:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f14;--pn:#171922;--tx:#e8e6e6;--mu:#9a9aa5;--ln:#2a2d3a;--ac:#d6342f;box-sizing:border-box}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f3f6;--pn:#fff;--tx:#1b1c22;--mu:#5d5f6b;--ln:#d9dae2}}
:root[data-theme="dark"]{--bg:#0e0f14;--pn:#171922;--tx:#e8e6e6;--mu:#9a9aa5;--ln:#2a2d3a}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;padding:16px;max-width:1500px;margin:auto}
@media(max-width:860px){.w{grid-template-columns:1fr}}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:14px}
h1{font-size:17px;margin:0 0 10px}label{display:block;font-size:12px;color:var(--mu);margin:8px 0 0}
input,select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--ln);background:transparent;color:var(--tx);font:inherit}
input[type=range]{padding:0}.g{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
button{padding:10px 14px;border-radius:10px;border:1px solid var(--ln);background:transparent;color:var(--tx);font:inherit;cursor:pointer}
button.pr{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.r{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.st{position:sticky;top:12px;align-self:start}
canvas{width:100%;height:auto;display:block;border-radius:10px;background:#000;touch-action:none;cursor:grab}
small{color:var(--mu)}.tp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}.tp button{padding:5px;text-align:center;font-size:12px;line-height:1.25}.tp button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}.tp img{width:100%;border-radius:6px;display:block;margin-bottom:4px}
</style></head><body>
<div class="w">
<div class="pn"><h1>Банер кодом (4:3)</h1>
<label>Фото авто<input type="file" id="ph" accept="image/*"></label>
<label>Ракурс фото — обери шаблон</label><div class="tp" id="pk"></div>
<label>Масштаб фото<input type="range" id="zm" min="30" max="400" value="100"></label>
<small>Перетягуй фото мишею по банеру, колесо миші = масштаб.</small>
<div class="r" style="margin-top:6px"><button id="fw" type="button">Заповнити по ширині</button><button id="fh" type="button">Вписати по висоті</button></div>
<details open style="margin-top:8px"><summary><b>Тонке налаштування фото і фону</b></summary>
<label>Позиція X<input type="range" id="px" min="-1200" max="1200" value="0"></label>
<label>Позиція Y<input type="range" id="py" min="-900" max="900" value="0"></label>
<label>Нахил фото (±10°)<input type="range" id="rt" min="-100" max="100" value="0"></label>
<label>Яскравість авто<input type="range" id="br" min="-40" max="40" value="0"></label>
<label>Плавність країв фото<input type="range" id="fe" min="0" max="400" value="170"></label>
<label>Фон навколо фото<select id="bgm"><option value="blur">Розмита копія фото</option><option value="mirror">Дзеркальне продовження сцени</option><option value="dark">Темний (без фону)</option></select></label>
<label>Розмиття фону<input type="range" id="bb" min="0" max="100" value="25"></label>
<label>Затемнення фону<input type="range" id="bd" min="0" max="90" value="45"></label>
<label>Ширина темної зони зліва<input type="range" id="lw" min="30" max="150" value="100"></label>
<label>Сила темної зони зліва<input type="range" id="la" min="40" max="100" value="100"></label>
</details>
<div class="g" id="fl"></div>
<div class="r"><button id="rs">Скинути позицію</button><button class="pr" id="dl">⬇ Завантажити JPEG</button><button id="us" hidden>Використати як фото №1</button></div>
</div>
<div class="pn st"><canvas id="cv"></canvas><small id="inf"></small></div>
</div>
