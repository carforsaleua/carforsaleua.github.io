<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Адмінка CARFORSALE.UA</title>
<link rel="icon" href="assets/favicon.png">
<style>
:root{--bg:#0a0a0a;--p:#141414;--ln:#2a2a2a;--red:#e11d2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eee;font:15px/1.5 -apple-system,Inter,system-ui,sans-serif}
.w{max-width:980px;margin:auto;padding:16px}h1{font-size:20px;margin:0}h3{margin:26px 0 6px;color:#ff6670;font-size:15px}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;background:#0d0d0d;border:1px solid var(--ln);border-radius:10px;padding:10px;margin:4px 0 12px}
button{cursor:pointer;border:1px solid var(--ln);background:var(--p);border-radius:10px;padding:9px 14px}button:disabled{opacity:.5}
.pr{background:var(--red);border-color:var(--red);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs .on{background:var(--red);border-color:var(--red)}
.row{display:flex;gap:12px;align-items:center;background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:10px;flex-wrap:wrap}
.row img{width:110px;border-radius:8px}.row .i{flex:1;min-width:150px}.off{opacity:.45}small{color:#999}
label{font-size:13px;color:#aaa;display:block}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
dialog{background:var(--p);color:#eee;border:1px solid var(--red);border-radius:14px;width:min(94vw,520px);max-height:92vh}dialog::backdrop{background:rgba(0,0,0,.8)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--ln);padding:10px 18px;border-radius:10px;display:none;z-index:99}
#login{max-width:360px;margin:12vh auto;padding:16px}.hint{color:#999;font-size:13px}
@media(max-width:600px){.g2{grid-template-columns:1fr}.row img{width:84px}}
</style>
</head>
<body>
<div id="login" hidden><h1>Вхід в адмінку</h1><p class="hint">CARFORSALE.UA</p>
 <form id="lf"><label>Email<input name="e" type="email" autocomplete="username" required></label><label>Пароль<input name="p" type="password" autocomplete="current-password" required></label><button class="pr" style="width:100%">Увійти</button></form></div>
<div id="app" class="w" hidden>
 <div class="top"><h1>Адмінка CARFORSALE.UA</h1><span><a href="index.html" target="_blank" style="color:#aaa">Сайт ↗</a> <button id="out">Вийти</button></span></div>
 <div class="tabs" id="tabs"><button data-t="cars" class="on">Авто</button><button data-t="nums">Цифри й статистика</button><button data-t="links">Кнопки й посилання</button><button data-t="rev">Відгуки</button></div>
 <div id="p-cars"></div><div id="p-nums" hidden></div><div id="p-links" hidden></div><div id="p-rev" hidden></div>
</div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(!CFG.url||!CFG.key){document.body.innerHTML='<p style="padding:30px">Спочатку заповніть <b>config.js</b> (Project URL і anon key з Supabase).</p>'}
const sb=supabase.createClient(CFG.url||'https://x.supabase.co',CFG.key||'x');
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)};

/* --- фото: стиснення й завантаження --- */
async function upload(file){const bmp=await createImageBitmap(file),w=Math.min(1280,bmp.width),h=Math.round(bmp.height*w/bmp.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);
 const tb=(t,q)=>new Promise(r=>c.toBlob(r,t,q));let b=await tb('image/webp',.82);if(b.type!=='image/webp')b=await tb('image/jpeg',.86);
 const name=Date.now()+'-'+Math.random().toString(36).slice(2,7)+(b.type==='image/webp'?'.webp':'.jpg');
 const{error}=await sb.storage.from('banners').upload(name,b,{contentType:b.type});if(error)throw error;
 return sb.storage.from('banners').getPublicUrl(name).data.publicUrl}

/* --- поля форм --- */
const fld=([k,l,t],v)=>{const x=v?.[k]??(t==='check'?true:'');return t==='check'?`<label><input type="checkbox" name="${k}" ${x?'checked':''} style="width:auto;margin:0 6px 12px 0">${l}</label>`:t==='textarea'?`<label>${l}<textarea name="${k}" rows="3">${esc(x)}</textarea></label>`:`<label>${l}<input name="${k}" type="${t||'text'}" value="${esc(x)}"></label>`};
const read=(f,fs)=>{const o={};fs.forEach(([k,,t])=>{const e=f.elements[k];o[k]=t==='check'?e.checked:t==='number'?+e.value||0:e.value.trim()});return o};

/* --- універсальний список: авто / відгуки --- */
function crud(box,table,fields,o){
 const load=async()=>{const{data,error}=await sb.from(table).select('*').order('sort').order('id',{ascending:false});if(error)return toast(error.message);
  box.innerHTML=`<button class="pr" id="add">＋ ${o.add}</button><p class="hint">«Порядок»: менше число = вище в списку. «Сховати» прибирає зі сайту, але не видаляє.</p>`+data.map(r=>`<div class="row ${r.active?'':'off'}" data-id="${r.id}">${o.img&&r.image?`<img src="${esc(r.image)}" alt="">`:''}<div class="i"><b>${esc(r[o.title])}</b><br><small>${esc(o.sub(r))}</small></div><button data-a="t">${r.active?'Сховати':'Показати'}</button><button data-a="e">Змінити</button><button data-a="d">Видалити</button></div>`).join('');
  box.querySelector('#add').onclick=()=>edit();
  box.querySelectorAll('.row').forEach(row=>row.onclick=async e=>{const a=e.target.dataset.a;if(!a)return;const r=data.find(x=>x.id==row.dataset.id);
   if(a==='t'){await sb.from(table).update({active:!r.active}).eq('id',r.id);load()}
   if(a==='e')edit(r);
   if(a==='d'&&confirm('Видалити «'+r[o.title]+'»? Це незворотно.')){if(r.image&&r.image.includes('/banners/'))await sb.storage.from('banners').remove([r.image.split('/banners/')[1]]);const{error}=await sb.from(table).delete().eq('id',r.id);if(error)toast(error.message);load()}})};
 const edit=(r={})=>{const d=document.createElement('dialog');
  d.innerHTML=`<form>${o.img?`<label>Банер (фото-реклама авто)<input type="file" name="file" accept="image/*"></label>${r.image?`<img src="${esc(r.image)}" style="width:220px;border-radius:8px;display:block;margin:0 0 12px">`:''}`:''}${fields.map(f=>fld(f,r)).join('')}<button class="pr">Зберегти</button> <button type="button" id="x">Скасувати</button></form>`;
  document.body.append(d);d.showModal();const close=()=>{d.close();d.remove()};d.querySelector('#x').onclick=close;
  d.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('.pr');b.disabled=true;
   try{const v=read(f,fields);if(o.img){const file=f.elements.file.files[0];if(file)v.image=await upload(file);else if(!r.image)throw Error('Додайте банер');}
    const{error}=await(r.id?sb.from(table).update(v).eq('id',r.id):sb.from(table).insert(v));if(error)throw error;close();toast('Збережено ✓');load()}catch(x){toast(x.message||'Помилка');b.disabled=false}}};
 load()}

/* --- налаштування: цифри та посилання --- */
const TG='https://t.me/Mr_carforsale';
const NUMS=[['Цифри під головним екраном',[['hero.subs','Підписники','800K+'],['hero.reach','Охоплення','9 МЛН+'],['hero.price','Ціна від','350₴'],['hero.nopay','Без посередників','100%']]],
['Статистика: Instagram',[['ig.views','Перегляди','3,4 млн'],['ig.views_label','Підпис до переглядів','переглядів за 30 днів'],['ig.viewers','Унікальні глядачі','1,9 млн'],['ig.subs','Підписники','25,4 тис.'],['ig.subs_label','Підпис до підписників','підписників, +5 408']]],
['Статистика: Facebook',[['fb.views','Перегляди','4,3 млн'],['fb.views_label','Підпис до переглядів','переглядів за 28 днів'],['fb.viewers','Унікальні глядачі','1,7 млн'],['fb.subs','Підписники','21 тис.']]],
['Підсумок під статистикою',[['stats.total_views','Усього переглядів (IG+FB)','7,7 млн'],['stats.total_viewers','Унікальних глядачів (IG+FB)','3,6 млн'],['stats.date','Дані станом на (дата)','15.11.2026']]],
['Ціни тарифів',[['tariff.std','Стандарт','350₴'],['tariff.pro','PRO','500₴'],['tariff.vip','VIP','800₴']]],
['Відгуки Google',[['reviews.summary','Рядок над відгуками','5,0 на Google · 5 відгуків']]]];
const SELL=['link.nav_sell','link.hero_sell','link.how_sell','link.tariff_head','link.tariff_std','link.tariff_pro','link.tariff_vip','link.footer_sell'];
const LINKS=[['Кнопки «Продати авто» / «Розмістити оголошення» / «Обрати тариф»',[['link.nav_sell','Шапка: «Продати авто»',TG],['link.hero_sell','Головний екран: «Розмістити оголошення»',TG],['link.how_sell','Блок «3 кроки»: «Розмістити оголошення»',TG],['link.tariff_head','Тарифи: «Замовити розміщення»',TG],['link.tariff_std','Тариф «Стандарт»: «Обрати тариф»',TG],['link.tariff_pro','Тариф PRO: «Обрати тариф»',TG],['link.tariff_vip','Тариф VIP: «Обрати тариф»',TG],['link.footer_sell','Футер: «Продати авто»',TG]]],
['Інші кнопки',[['link.manager','«Зв’язатися з менеджером» (шапка й футер)',TG],['link.telegram','Кнопка Telegram внизу сторінки',TG]]],
['Соцмережі, додаток, контакти',[['link.instagram','Instagram (і кнопка «Переглянути всі авто»)','https://www.instagram.com/carforsale.ua_online/'],['link.facebook','Facebook','https://www.facebook.com/people/Carforsaleua/61557268495368/'],['link.tiktok','TikTok','https://www.tiktok.com/@car.forsale'],['link.appstore','App Store','https://apps.apple.com/ua/search?term=carforsale.ua'],['link.googleplay','Google Play','https://play.google.com/store/search?q=carforsale.ua&c=apps'],['link.reviews','Відгуки на Google','https://share.google/oxJLhAqPVR7rzHKvR'],['link.founder','Написати засновнику','https://t.me/MrKapard'],['link.phone','Телефон (для дзвінка)','+380731063852'],['contact.phone_label','Телефон (як показувати)','+380 73 106 38 52'],['link.email','Email','carforsaleua@gmail.com']]]];
async function settings(box,groups,tool){
 const{data,error}=await sb.from('settings').select('key,value');if(error)return toast(error.message);const m=Object.fromEntries(data.map(r=>[r.key,r.value]));
 box.innerHTML=`<form>${groups.map(([t,fs])=>`<h3>${t}</h3><div class="g2">${fs.map(([k,l,d])=>`<label>${l}<input name="${k}" value="${esc(m[k]??d)}"></label>`).join('')}</div>`).join('')}${tool?`<h3>Швидко</h3><label>Одне посилання на всі кнопки «Продати авто» (потім натисніть «Зберегти»)<input id="all" placeholder="https://t.me/..."></label><button type="button" id="fill">Підставити у всі 8 кнопок</button>`:''}<p><button class="pr" style="width:100%;padding:13px">Зберегти зміни</button></p><p class="hint">Зміни з’являються на сайті одразу після оновлення сторінки.</p></form>`;
 const f=box.querySelector('form');if(tool)$('#fill').onclick=()=>{const v=$('#all').value.trim();if(v)SELL.forEach(k=>f.elements[k].value=v)};
 f.onsubmit=async e=>{e.preventDefault();const rows=groups.flatMap(g=>g[1]).map(([k])=>({key:k,value:f.elements[k].value.trim()}));const{error}=await sb.from('settings').upsert(rows);toast(error?error.message:'Збережено ✓')}}

/* --- вхід і вкладки --- */
const tabs={cars:()=>crud($('#p-cars'),'cars',[['title','Назва (напр. BMW X6 2016)'],['price','Ціна (напр. $29 200)'],['city','Місто'],['phone','Телефон власника (+380...)'],['owner','Ім’я власника'],['description','Короткий опис (необов’язково)','textarea'],['sort','Порядок','number'],['active','Показувати на сайті','check']],{img:1,add:'Додати авто',title:'title',sub:r=>`${r.price||''} · ${r.city||''} · ${r.phone||''}`}),
 nums:()=>settings($('#p-nums'),NUMS),links:()=>settings($('#p-links'),LINKS,1),
 rev:()=>crud($('#p-rev'),'reviews',[['name','Ім’я клієнта'],['text','Відгук','textarea'],['stars','Зірок (1–5)','number'],['sort','Порядок','number'],['active','Показувати на сайті','check']],{add:'Додати відгук',title:'name',sub:r=>'★'.repeat(r.stars)+' '+r.text.slice(0,70)})};
const start=()=>{$('#login').hidden=true;$('#app').hidden=false;tabs.cars()};
$('#tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b===e.target));['cars','nums','links','rev'].forEach(x=>$('#p-'+x).hidden=x!==t);tabs[t]()};
$('#lf').onsubmit=async e=>{e.preventDefault();const f=e.target,{error}=await sb.auth.signInWithPassword({email:f.e.value.trim(),password:f.p.value});error?toast('Невірний email або пароль'):start()};
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
if(CFG.url)sb.auth.getSession().then(({data})=>data.session?start():$('#login').hidden=false);
</script>
</body>
</html>
